<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="system-ui, -apple-system, sans-serif">
  <!-- Placeholder journey map. Replace with an export from Figma/Illustrator.
       Groups with an id listed under "hotspots" in data.js become clickable. -->
  <text x="20" y="32" font-size="13" fill="#6b6b66">Placeholder: replace with your journey map</text>

  <!-- Confidence axis -->
  <text x="20" y="160" font-size="11" fill="#6b6b66">Confident</text>
  <text x="20" y="330" font-size="11" fill="#6b6b66">Uneasy</text>
  <line x1="20" y1="245" x2="620" y2="245" stroke="#e4e4de" stroke-width="1"/>

  <!-- Confidence curve across the stages -->
  <path d="M80 170 C 130 170, 150 190, 180 200 S 240 300, 280 310 S 340 260, 380 230 S 440 280, 480 300 S 540 200, 580 180"
        fill="none" stroke="#c2410c" stroke-width="2.5"/>

  <g id="stage-prompt">
    <rect x="45" y="60" width="90" height="300" rx="6" fill="#000" fill-opacity="0"/>
    <text x="90" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1b">Prompt</text>
    <circle cx="80" cy="170" r="6" fill="#c2410c"/>
  </g>

  <g id="stage-generate">
    <rect x="140" y="60" width="90" height="300" rx="6" fill="#000" fill-opacity="0"/>
    <text x="185" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1b">Generate</text>
    <circle cx="180" cy="200" r="6" fill="#c2410c"/>
  </g>

  <g id="stage-review">
    <rect x="235" y="60" width="90" height="300" rx="6" fill="#000" fill-opacity="0"/>
    <text x="280" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1b">Review</text>
    <circle cx="280" cy="310" r="6" fill="#c2410c"/>
  </g>

  <g id="stage-test">
    <rect x="335" y="60" width="90" height="300" rx="6" fill="#000" fill-opacity="0"/>
    <text x="380" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1b">Test</text>
    <circle cx="380" cy="230" r="6" fill="#c2410c"/>
  </g>

  <g id="stage-ship">
    <rect x="435" y="60" width="90" height="300" rx="6" fill="#000" fill-opacity="0"/>
    <text x="480" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1b">Ship</text>
    <circle cx="480" cy="300" r="6" fill="#c2410c"/>
  </g>

  <g id="stage-own">
    <rect x="535" y="60" width="90" height="300" rx="6" fill="#000" fill-opacity="0"/>
    <text x="580" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#1d1d1b">Own</text>
    <circle cx="580" cy="180" r="6" fill="#c2410c"/>
  </g>

  <text x="320" y="395" text-anchor="middle" font-size="11" fill="#6b6b66">Engineer's confidence in agent output at each stage</text>
</svg>
